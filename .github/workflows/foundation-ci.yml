name: Storyforge Foundation CI

# TEMPORARY: automatic triggers are disabled while GitHub-hosted jobs fail
# before step execution (runner_id=0, steps=[]). Tracked in Issue #2.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Validate T-NIR reference universe
        run: npm run validate:schema
