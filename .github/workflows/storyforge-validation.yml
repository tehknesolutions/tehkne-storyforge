name: Storyforge Validation

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storyforge-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Root static validation
        run: npm run validate
      - name: Story Lab executable probes
        run: npm run validate:story-lab-probes
      - name: Story Lab typecheck
        run: npm run typecheck:story-lab
      - name: Story Lab build
        run: npm run build:story-lab
